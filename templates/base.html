<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Pxplore{% endblock %} · Pxplore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body class="app">
<header class="nav"><div class="wrap">
  <a class="brand" href="{{ url_for('home') }}"><span>🧭</span><b class="grad">Pxplore</b></a>
  {% if display_name %}
  <ul class="tabs-nav"><li><a href="{{ url_for('learn') }}" class="{{ 'on' if active=='learn' }}">Learn</a></li><li><a href="{{ url_for('me') }}" class="{{ 'on' if active=='me' }}">Me</a></li></ul>
  <div class="who"><span>{{ display_name }}</span><a class="btn ghost small" href="{{ url_for('logout') }}">Log out</a></div>
  {% endif %}
</div></header>
<main class="wrap page">
{% for cat, m in get_flashed_messages(with_categories=true) %}<div class="alert {{ cat }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
